<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm p-4">
  <!-- Modal Content -->
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto">

    <!-- Header -->
    <div class="px-6 py-5 border-b border-slate-100 flex flex-col relative">
      <button type="button" (click)="closed.emit()" [disabled]="isSubmitting()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 transition-colors">
        <span class="material-symbols-outlined text-[20px]">close</span>
      </button>
      <h3 class="text-[20px] font-bold text-slate-900 tracking-tight">Añadir Nuevo Cliente</h3>
      <p class="text-[13px] text-slate-500 font-medium mt-1">Al guardarlo quedará seleccionado en la cita.</p>
    </div>

    <!-- Body -->
    <form [formGroup]="form" (ngSubmit)="save()" class="p-6 space-y-5">

      <div>
        <label for="client-modal-fullName" class="block text-[13px] font-bold text-slate-800 mb-2">Nombre completo <span class="text-red-500">*</span></label>
        <input id="client-modal-fullName" type="text" formControlName="fullName" placeholder="Ej. Ana García"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[14px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
      </div>

      <div>
        <label for="client-modal-phone" class="block text-[13px] font-bold text-slate-800 mb-2">Teléfono <span class="text-red-500">*</span></label>
        <input id="client-modal-phone" type="tel" formControlName="phone" placeholder="Ej. (555) 123-4567"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[14px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
      </div>

      <div>
        <label for="client-modal-email" class="block text-[13px] font-bold text-slate-800 mb-2">Correo electrónico</label>
        <input id="client-modal-email" type="email" formControlName="email" placeholder="Ej. ana.garcia@example.com"
               class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[14px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
      </div>

      <label for="client-modal-admiteFacturas" class="inline-flex items-center gap-3 cursor-pointer select-none">
        <input id="client-modal-admiteFacturas" type="checkbox" formControlName="admiteFacturas" class="w-4 h-4 accent-blue-500">
        <span class="text-[13px] font-bold text-slate-800">Admite Facturas</span>
      </label>

      @if (form.controls.admiteFacturas.value) {
        <div class="space-y-4 rounded-xl border border-blue-100 bg-blue-50/40 p-4">
          <div>
            <label for="client-modal-direccion" class="block text-[13px] font-bold text-slate-800 mb-2">Dirección <span class="text-red-500">*</span></label>
            <input id="client-modal-direccion" type="text" formControlName="direccion" placeholder="Ej. Calle Mayor 12, 28001 Madrid"
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[14px] text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400">
          </div>
          <div>
            <label for="client-modal-cifNif" class="block text-[13px] font-bold text-slate-800 mb-2">CIF / NIF <span class="text-red-500">*</span></label>
            <input id="client-modal-cifNif" type="text" formControlName="cifNif" placeholder="Ej. B12345678 o 12345678A"
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[14px] text-slate-800 bg-white focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400">
          </div>
        </div>
      }

      @if (errorMessage(); as error) {
        <div class="flex items-center gap-2 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-[13px] font-medium">
          <span class="material-symbols-outlined text-[18px] shrink-0">error</span>
          {{ error }}
        </div>
      }

      <!-- Footer -->
      <div class="pt-2 flex justify-end gap-3">
        <button type="button" (click)="closed.emit()" [disabled]="isSubmitting()"
                class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-[14px] transition-colors disabled:opacity-50">
          Cancelar
        </button>
        <button type="submit" [disabled]="form.invalid || isSubmitting()"
                class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-semibold text-[14px] transition-colors shadow-[0_2px_10px_rgba(59,130,246,0.3)] disabled:opacity-50 disabled:cursor-not-allowed">
          @if (isSubmitting()) {
            <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-[18px]">save</span>
          }
          Guardar cliente
        </button>
      </div>
    </form>
  </div>
</div>
