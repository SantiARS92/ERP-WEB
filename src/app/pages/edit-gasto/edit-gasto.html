<div class="h-[calc(100vh-theme(spacing.20))] overflow-y-auto bg-white">

  <div class="max-w-4xl mx-auto py-8 px-8 pb-20 relative">

    <!-- Header -->
    <div class="mb-8">
      <div class="text-[13px] font-medium text-slate-500 mb-1 flex items-center gap-1.5">
        <span class="hover:text-blue-600 cursor-pointer transition-colors" routerLink="/gastos">Gastos</span>
        <span class="text-slate-400 text-[15px]">›</span>
        <span class="text-slate-600">Editar Gasto</span>
      </div>
      <h1 class="text-[28px] font-bold text-slate-900 leading-tight">Modificar Gasto</h1>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading" class="bg-white rounded-2xl border border-slate-200 p-8 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] w-full animate-pulse space-y-6">
      <div class="h-5 bg-slate-100 rounded-full w-1/3"></div>
      <div class="h-12 bg-slate-100 rounded-xl w-full"></div>
      <div class="h-5 bg-slate-100 rounded-full w-1/4"></div>
      <div class="h-12 bg-slate-100 rounded-xl w-full"></div>
      <div class="grid grid-cols-2 gap-6">
        <div class="h-12 bg-slate-100 rounded-xl"></div>
        <div class="h-12 bg-slate-100 rounded-xl"></div>
      </div>
    </div>

    <!-- Form Card -->
    <div *ngIf="!isLoading" class="bg-white rounded-2xl border border-slate-200 p-8 shadow-[0_2px_10px_-4px_rgba(0,0,0,0.05)] w-full">

      <div class="space-y-6">

        <!-- Concept -->
        <div>
          <label class="block text-[13px] font-bold text-slate-800 mb-2">Concepto *</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">description</span>
            <input type="text" [(ngModel)]="expense.concept" name="concept" (input)="onConceptInput()" placeholder="Ej: Champú L'Oreal Prof" autocomplete="off"
                   class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 text-[15px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
            
            <!-- Suggestions Dropdown -->
            <div *ngIf="conceptSuggestions.length > 0" class="absolute top-full left-0 w-full bg-white border border-slate-100 rounded-xl shadow-xl z-50 mt-1 max-h-48 overflow-y-auto overflow-x-hidden transition-all">
              <button type="button" *ngFor="let suggestion of conceptSuggestions" (click)="selectSuggestion(suggestion)"
                      class="w-full text-left px-4 py-2.5 text-[14px] text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors border-b border-slate-50 last:border-0 font-medium font-sans">
                {{ suggestion }}
              </button>
            </div>
          </div>
          <p *ngIf="expense.category === 'SUPPLIES' && !conceptSelectedFromSuggestions && expense.concept" class="text-[11px] text-orange-600 mt-1 font-medium italic animate-pulse">
            Debe seleccionar uno de los productos sugeridos.
          </p>
        </div>

        <!-- Category -->
        <div>
          <label class="block text-[13px] font-bold text-slate-800 mb-2">Categoría</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">label</span>
            <select [(ngModel)]="expense.category" name="category"
                    class="w-full pl-11 pr-10 py-3 rounded-xl border border-slate-200 text-[15px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow appearance-none cursor-pointer bg-white">
              <option *ngFor="let cat of categories" [value]="cat.value">{{ cat.label }}</option>
            </select>
            <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
          </div>
        </div>

        <!-- Amount & Quantity -->
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-[13px] font-bold text-slate-800 mb-2">Importe (€) *</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-[15px]">€</span>
              <input type="number" [(ngModel)]="expense.amount" name="amount" step="0.01" min="0.01"
                     class="w-full pl-9 pr-4 py-3 rounded-xl border border-slate-200 text-[15px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
            </div>
          </div>
          <div>
            <label class="block text-[13px] font-bold text-slate-800 mb-2">Cantidad *</label>
            <input type="number" [(ngModel)]="expense.quantity" name="quantity" min="1" step="1"
                   class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[15px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
          </div>
        </div>

        <!-- Date -->
        <div class="pb-6 border-b border-slate-100">
          <label class="block text-[13px] font-bold text-slate-800 mb-2">Fecha</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">calendar_today</span>
            <input type="date" [(ngModel)]="expense.expenseDate" name="expenseDate"
                   class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 text-[15px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow">
          </div>
        </div>

        <!-- Notes -->
        <div>
          <label class="block text-[13px] font-bold text-slate-800 mb-2">Notas <span class="font-normal text-slate-400">(Opcional)</span></label>
          <textarea rows="3" [(ngModel)]="expense.notes" name="notes" placeholder="Añade cualquier detalle aquí..."
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 text-[15px] text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-shadow resize-y"></textarea>
        </div>

        <!-- Actions Footer -->
        <div class="flex items-center justify-between pt-2">
          <button (click)="deleteExpense()"
                  class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-red-500 hover:bg-red-50 font-medium text-[14px] transition-colors cursor-pointer">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            Eliminar Gasto
          </button>

          <div class="flex items-center gap-3">
            <a routerLink="/gastos"
               class="px-6 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-[14px] transition-colors shadow-sm cursor-pointer">
              Cancelar
            </a>
            <button [disabled]="isSubmitting" (click)="saveExpense()"
                    class="flex items-center gap-2 px-6 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-600 disabled:opacity-75 disabled:cursor-not-allowed text-white font-bold text-[14px] transition-colors shadow-sm cursor-pointer">
              <span class="material-symbols-outlined text-[18px]" *ngIf="!isSubmitting">save</span>
              <span class="material-symbols-outlined text-[18px] animate-spin" *ngIf="isSubmitting">progress_activity</span>
              {{ isSubmitting ? 'Guardando...' : 'Guardar Cambios' }}
            </button>
          </div>
        </div>

      </div>
    </div>

    <div class="mt-8 text-center text-[12px] text-slate-400 font-medium">
      Los cambios se aplicarán inmediatamente tras guardar.
    </div>
  </div>
</div>
