<div class="h-[calc(100vh-theme(spacing.20))] overflow-y-auto bg-white">

  <div class="max-w-3xl mx-auto py-8 px-8 pb-20">

    <!-- Compact Header -->
    <div class="mb-8">
      <div class="text-[13px] font-medium text-slate-500 mb-1 flex items-center gap-1.5">
        <span class="hover:text-blue-600 cursor-pointer transition-colors" routerLink="/clientes">Clientes</span>
        <span class="text-slate-400 text-[15px]">›</span>
        <span class="text-slate-600">Editar Cliente</span>
      </div>
      <h1 class="text-[28px] font-bold text-slate-900 leading-tight">Modificar Cliente</h1>
    </div>

  <!-- Loading State -->
  @if (isLoading()) {
    <div class="flex justify-center p-12">
      <span class="material-symbols-outlined animate-spin text-blue-500 text-4xl">progress_activity</span>
    </div>
  } @else {
    <!-- Form Card -->
    <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8 flex flex-col items-center">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="w-full space-y-6">

        <!-- Name Field -->
        <div>
          <label for="client-fullName" class="block text-[14px] font-bold text-slate-800 mb-2">Nombre completo <span class="text-red-500">*</span></label>
          <input 
            type="text" 
            id="client-fullName"
            formControlName="fullName"
            placeholder="Ej. Ana García" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400">
        </div>

        <!-- Phone Field -->
        <div>
          <label for="client-phone" class="block text-[14px] font-bold text-slate-800 mb-2">Teléfono <span class="text-red-500">*</span></label>
          <input 
            type="tel" 
            id="client-phone"
            formControlName="phone"
            placeholder="Ej. (555) 123-4567" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400">
        </div>

        <!-- Email Field -->
        <div>
          <label for="client-email" class="block text-[14px] font-bold text-slate-800 mb-2">Correo electrónico</label>
          <input 
            type="email" 
            id="client-email"
            formControlName="email"
            placeholder="Ej. ana.garcia@example.com" 
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400">
        </div>

        <!-- Admite Facturas Checkbox -->
        <div class="pt-1">
          <label for="client-admiteFacturas" class="inline-flex items-center gap-3 cursor-pointer select-none group">
            <div class="relative">
              <input
                type="checkbox"
                id="client-admiteFacturas"
                formControlName="admiteFacturas"
                class="sr-only peer">
              <div class="w-10 h-6 bg-slate-200 peer-checked:bg-blue-500 rounded-full transition-colors duration-200 ease-in-out group-hover:ring-2 group-hover:ring-blue-100"></div>
              <div class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow-sm transition-transform duration-200 ease-in-out peer-checked:translate-x-4"></div>
            </div>
            <div>
              <span class="text-[14px] font-bold text-slate-800">Admite Facturas</span>
              <p class="text-[12px] text-slate-400 leading-tight">El cliente puede recibir facturas con datos fiscales</p>
            </div>
          </label>
        </div>

        <!-- Billing Fields (conditional) -->
        @if (form.controls.admiteFacturas.value) {
          <div class="space-y-5 rounded-xl border border-blue-100 bg-blue-50/40 p-5 transition-all duration-200">

            <!-- Identificador Visual (Read Only) -->
            @if (identificador(); as identificador) {
              <div class="flex items-center justify-between bg-white border border-slate-200 px-4 py-3 rounded-xl shadow-sm">
                 <div class="text-[13px] font-bold text-slate-500">Nº Cliente Facturación:</div>
                 <div class="text-[14px] font-mono font-bold text-blue-600 bg-blue-50 px-2.5 py-0.5 rounded">{{ identificador }}</div>
              </div>
            }

            <!-- Dirección -->
            <div>
              <label for="client-direccion" class="block text-[14px] font-bold text-slate-800 mb-2">
                Dirección <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                id="client-direccion"
                formControlName="direccion"
                placeholder="Ej. Calle Mayor 12, 28001 Madrid"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400 bg-white">
            </div>

            <!-- CIF / NIF -->
            <div>
              <label for="client-cifNif" class="block text-[14px] font-bold text-slate-800 mb-2">
                CIF / NIF <span class="text-red-500">*</span>
              </label>
              <input
                type="text"
                id="client-cifNif"
                formControlName="cifNif"
                placeholder="Ej. B12345678 o 12345678A"
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400 bg-white">
            </div>

          </div>
        }

        <!-- Error Message -->
        @if (errorMessage(); as error) {
          <div class="flex items-center gap-2 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-[14px] font-medium">
            <span class="material-symbols-outlined text-[18px] shrink-0">error</span>
            {{ error }}
          </div>
        }

        <!-- Actions Footer -->
        <div class="flex items-center justify-between pt-4 mt-2 border-t border-slate-100 w-full">
          <button type="button" (click)="deleteClient()" class="flex items-center gap-2 px-4 py-2.5 rounded-xl text-red-500 hover:bg-red-50 font-medium text-[14px] transition-colors cursor-pointer disabled:opacity-50">
            <span class="material-symbols-outlined text-[18px]">delete</span>
            Eliminar Cliente
          </button>
          <div class="flex items-center gap-3">
            <button type="button" (click)="cancel()" class="px-6 py-2.5 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-bold text-[14px] transition-colors shadow-sm cursor-pointer">
              Cancelar
            </button>
            <button type="submit" [disabled]="form.invalid || isSubmitting()" class="flex items-center gap-2 px-6 py-2.5 rounded-xl bg-blue-500 hover:bg-blue-600 active:bg-blue-700 disabled:opacity-75 disabled:cursor-not-allowed text-white font-bold text-[14px] transition-colors shadow-sm cursor-pointer">
              @if (isSubmitting()) {
                <span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>
              } @else {
                <span class="material-symbols-outlined text-[18px]">save</span>
              }
              Guardar Cambios
            </button>
          </div>
        </div>

      </form>
    </div>
  }
  </div>
</div>
