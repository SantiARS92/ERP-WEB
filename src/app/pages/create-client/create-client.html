<div class="h-[calc(100vh-theme(spacing.20))] overflow-y-auto bg-white">

  <div class="max-w-3xl mx-auto py-8 px-8 pb-20">

    <!-- Compact Header -->
    <div class="mb-8">
      <div class="text-[13px] font-medium text-slate-500 mb-1 flex items-center gap-1.5">
        <span class="hover:text-blue-600 cursor-pointer transition-colors" routerLink="/clientes">Clientes</span>
        <span class="text-slate-400 text-[15px]">›</span>
        <span class="text-slate-600">Añadir Cliente</span>
      </div>
      <h1 class="text-[28px] font-bold text-slate-900 leading-tight">Crear Nuevo Cliente</h1>
    </div>

  <!-- Form Card -->
  <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-100 p-8">
    <form (ngSubmit)="onSubmit()" #clientForm="ngForm" class="space-y-6">

      <!-- Name Field -->
      <div>
        <label class="block text-[14px] font-bold text-slate-800 mb-2">Nombre completo <span class="text-red-500">*</span></label>
        <input 
          type="text" 
          name="fullName" 
          [(ngModel)]="client.fullName" 
          required 
          placeholder="Ej. Ana García" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400">
      </div>

      <!-- Phone Field -->
      <div>
        <label class="block text-[14px] font-bold text-slate-800 mb-2">Teléfono <span class="text-red-500">*</span></label>
        <input 
          type="tel" 
          name="phone" 
          [(ngModel)]="client.phone" 
          required
          placeholder="Ej. (555) 123-4567" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400">
      </div>

      <!-- Email Field -->
      <div>
        <label class="block text-[14px] font-bold text-slate-800 mb-2">Correo electrónico</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="client.email" 
          placeholder="Ej. ana.garcia@example.com" 
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400">
      </div>

      <!-- Admite Facturas Checkbox -->
      <div class="pt-1">
        <label class="inline-flex items-center gap-3 cursor-pointer select-none group">
          <div class="relative">
            <input
              type="checkbox"
              name="admiteFacturas"
              [(ngModel)]="client.admiteFacturas"
              class="sr-only peer">
            <div class="w-10 h-6 bg-slate-200 peer-checked:bg-blue-500 rounded-full transition-colors duration-200 ease-in-out group-hover:ring-2 group-hover:ring-blue-100"></div>
            <div class="absolute top-0.5 left-0.5 w-5 h-5 bg-white rounded-full shadow-sm transition-transform duration-200 ease-in-out peer-checked:translate-x-4"></div>
          </div>
          <div>
            <span class="text-[14px] font-bold text-slate-800">Admite Facturas</span>
            <p class="text-[12px] text-slate-400 leading-tight">El cliente puede recibir facturas con datos fiscales</p>
          </div>
        </label>
      </div>

      <!-- Billing Fields (conditional) -->
      @if (client.admiteFacturas) {
        <div class="space-y-5 rounded-xl border border-blue-100 bg-blue-50/40 p-5 transition-all duration-200">

          <!-- Dirección -->
          <div>
            <label class="block text-[14px] font-bold text-slate-800 mb-2">
              Dirección <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="direccion"
              [(ngModel)]="client.direccion"
              required
              placeholder="Ej. Calle Mayor 12, 28001 Madrid"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400 bg-white">
          </div>

          <!-- CIF / NIF -->
          <div>
            <label class="block text-[14px] font-bold text-slate-800 mb-2">
              CIF / NIF <span class="text-red-500">*</span>
            </label>
            <input
              type="text"
              name="cifNif"
              [(ngModel)]="client.cifNif"
              required
              placeholder="Ej. B12345678 o 12345678A"
              class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-100 focus:border-blue-400 transition-colors text-[15px] text-slate-800 placeholder-slate-400 bg-white">
          </div>

        </div>
      }

      <!-- Error Message -->
      @if (errorMessage) {
        <div class="flex items-center gap-2 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-[14px] font-medium">
          <span class="material-symbols-outlined text-[18px] shrink-0">error</span>
          {{ errorMessage }}
        </div>
      }

      <!-- Form Actions -->
      <div class="pt-4 grid grid-cols-2 gap-4">
        <button 
          type="submit" 
          [disabled]="clientForm.invalid || isSubmitting"
          class="w-full py-3.5 rounded-xl bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white font-semibold text-[15px] transition-colors shadow-[0_2px_10px_rgba(59,130,246,0.3)] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          @if (isSubmitting) {
            <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
          } @else {
            <span class="material-symbols-outlined text-[20px]">save</span>
          }
          Guardar cliente
        </button>
        <button 
          type="button" 
          (click)="cancel()"
          [disabled]="isSubmitting"
          class="w-full py-3.5 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 font-semibold text-[15px] transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Cancelar
        </button>
      </div>

    </form>
  </div>
</div>
