<div class="min-h-screen bg-gray-50 flex flex-col items-center justify-center p-6 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-blue-50/50 via-white to-purple-50/50">
  
  <!-- Branding Header -->
  <div class="text-center mb-8 animate-in fade-in slide-in-from-top-4 duration-700">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-blue-600 to-purple-600 flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-100 ring-4 ring-white">
      <span class="material-symbols-outlined text-white text-[32px] [font-variation-settings:'FILL'_1,'wght'_300]">shield</span>
    </div>
    <h1 class="text-2xl font-bold text-gray-900 tracking-tight mb-2">
      Bienvenido a "{{ settings()?.businessName || 'AppPimes' }}"
    </h1>
    <p class="text-gray-500 text-sm">Selecciona tu tipo de acceso para continuar</p>
  </div>

  <!-- Login Card -->
  <div class="w-full max-w-[400px] bg-white rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.05)] border border-gray-100/50 p-8 mb-6 animate-in fade-in zoom-in-95 duration-500 delay-150">
    <h2 class="text-xl font-bold text-gray-800 text-center mb-8">Iniciar Sesión</h2>

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Username -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 ml-1">Nombre de Usuario</label>
        <div class="relative group">
          <input 
            type="text" 
            [(ngModel)]="username" 
            name="username"
            placeholder="Ingresa tu usuario"
            class="w-full h-12 px-4 bg-gray-50 border border-transparent rounded-xl text-sm transition-all focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 placeholder:text-gray-400 outline-none"
          >
          <span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-300 group-focus-within:text-blue-500 transition-colors text-[20px]">person</span>
        </div>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 ml-1">Contraseña</label>
        <div class="relative group">
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            [(ngModel)]="password" 
            name="password"
            placeholder="Ingresa tu contraseña"
            class="w-full h-12 px-4 bg-gray-50 border border-transparent rounded-xl text-sm transition-all focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 placeholder:text-gray-400 outline-none"
          >
          <button 
            type="button"
            (click)="togglePassword()"
            class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-gray-300 hover:text-gray-600 transition-colors text-[20px] outline-none"
          >
            {{ showPassword() ? 'visibility' : 'visibility_off' }}
          </button>
        </div>
      </div>

      @if (error()) {
        <p class="text-[13px] text-red-500 text-center font-medium animate-in shake duration-300">
          {{ error() }}
        </p>
      }

      <button 
        type="submit"
        [disabled]="isLoading()"
        class="w-full h-12 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white rounded-xl font-semibold shadow-lg shadow-blue-200 transition-all active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none mt-4"
      >
        @if (isLoading()) {
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Cargando...
          </span>
        } @else {
          Iniciar Sesión
        }
      </button>
    </form>

  </div>

  <!-- Guest Access -->
  <button 
    (click)="loginAsGuest()"
    class="w-full max-w-[400px] h-12 bg-white border border-blue-100 rounded-xl flex items-center justify-center gap-2 text-sm font-semibold text-blue-600 shadow-sm hover:bg-blue-50 transition-all active:scale-[0.98] animate-in fade-in slide-in-from-bottom-4 duration-700 delay-500"
  >
    <span class="material-symbols-outlined text-[18px]">visibility</span>
    Acceder como Invitado
  </button>

  <p class="mt-8 text-[11px] text-gray-400 font-medium">Contraseña por defecto: 1234</p>
</div>
